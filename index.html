<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファンダニュース</title>
<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#111}
h1{font-size:18px;margin:0;padding:14px 16px;background:#0b2545;color:#fff}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:0}
nav button{flex:none;border:1px solid #ccd;background:#fff;border-radius:16px;padding:6px 12px;font-size:14px}
nav button.on{background:#0b2545;color:#fff}
ul{list-style:none;margin:0;padding:8px 12px}
li{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px}
li a{color:#111;text-decoration:none;font-size:15px;line-height:1.4}
li small{display:block;color:#778;margin-top:4px}
#msg{padding:16px;color:#778}
</style>
</head>
<body>
<h1>ファンダニュース</h1>
<nav id="tabs"></nav>
<div id="msg"></div>
<ul id="list"></ul>
<script>
const g=q=>"https://news.google.com/rss/search?q="+encodeURIComponent(q)+"&hl=ja&gl=JP&ceid=JP:ja";
const S={"要人発言":[
g("日銀総裁 OR 植田総裁 発言 when:2d"),
g("パウエル OR ウォーシュ OR FRB議長 発言 when:2d"),
g("ラガルド OR ECB総裁 OR ベセント OR 財務長官 発言 when:2d"),
g("トランプ大統領 関税 OR 制裁 OR ドル OR FRB when:2d")],
"Bloomberg":[g("site:bloomberg.co.jp OR site:bloomberg.com 為替 OR 金利 when:2d")],
"Reuters":[g("site:jp.reuters.com OR site:reuters.com 為替 OR 金利 when:2d")],
"WSJ":[g("site:jp.wsj.com OR site:wsj.com 市場 when:2d")],
"日経":[g("site:nikkei.com 為替 OR 金利 OR 日銀 when:2d")]};
const tabs=document.getElementById("tabs"),list=document.getElementById("list"),msg=document.getElementById("msg");let tk=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fmt=s=>{if(!s)return"";const d=new Date(s.replace(" ","T")+"Z");if(isNaN(d))return s;return s+" UTC（日本時間 "+d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false})+"）"};
async function one(u){const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(u));const d=await r.json();if(d.status&&d.status!=="ok")throw 0;return d.items||[]}
async function load(n,btn){const my=++tk;[...tabs.children].forEach(x=>x.classList.remove("on"));btn.classList.add("on");list.innerHTML="";msg.textContent="読み込み中…";const U=S[n],seen=new Set(),items=[];let ok=0;
for(let k=0;k<U.length;k++){if(my!==tk)return;try{(await one(U[k])).forEach(i=>{if(!seen.has(i.link)){seen.add(i.link);items.push(i)}});ok++;if(items.length){msg.textContent="";items.sort((a,b)=>(b.pubDate||"").localeCompare(a.pubDate||""));list.innerHTML=items.slice(0,30).map(i=>`<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a><small>${esc(fmt(i.pubDate))}</small></li>`).join("")}}catch(e){}if(k<U.length-1)await sleep(600)}
if(my===tk&&!items.length)msg.textContent="記事が見つかりませんでした（取得成功 "+ok+"/"+U.length+"）"}
Object.keys(S).forEach((n,i)=>{const b=document.createElement("button");b.textContent=n;b.onclick=()=>load(n,b);tabs.appendChild(b);if(i===0)load(n,b)});
</script>
</body>
</html>
