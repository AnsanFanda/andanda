<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファンダニュース</title>
<style>
  body{font-family:-apple-system,sans-serif;margin:0;background:#f5f6f8;color:#111}
  h1{font-size:18px;margin:0;padding:14px 16px;background:#0b2545;color:#fff}
  nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;position:sticky;top:0}
  nav button{flex:none;border:1px solid #ccd;background:#fff;border-radius:16px;padding:6px 12px;font-size:14px}
  nav button.on{background:#0b2545;color:#fff}
  ul{list-style:none;margin:0;padding:8px 12px}
  li{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px}
  li a{color:#111;text-decoration:none;font-size:15px;line-height:1.4}
  li small{display:block;color:#778;margin-top:4px}
  #msg{padding:16px;color:#778}
</style>
</head>
<body>
<h1>ファンダニュース</h1>
<nav id="tabs"></nav>
<div id="msg"></div>
<ul id="list"></ul>
<script>
const g = q => "https://news.google.com/rss/search?q=" + encodeURIComponent(q) + "&hl=ja&gl=JP&ceid=JP:ja";
const SOURCES = {
  "要人発言": g('(("植田総裁" OR "日銀総裁" OR "パウエル" OR "ウォーシュ" OR "FRB議長" OR "ラガルド" OR "ECB総裁" OR "ベセント" OR "財務長官") (発言 OR 講演 OR 会見 OR 示唆 OR 利上げ OR 利下げ) OR ("トランプ大統領" (関税 OR 制裁 OR ドル OR 利下げ OR FRB))) -阪神 -野球 -プロ野球 when:1d'),
  "Bloomberg": g("site:bloomberg.co.jp OR site:bloomberg.com 為替 OR 金利 when:1d"),
  "Reuters": g("site:jp.reuters.com OR site:reuters.com 為替 OR 金利 when:1d"),
  "WSJ": g("site:jp.wsj.com OR site:wsj.com 市場 when:1d"),
  "日経": g("site:nikkei.com 為替 OR 金利 OR 日銀 when:1d")
};
const tabs = document.getElementById("tabs");
const list = document.getElementById("list");
const msg = document.getElementById("msg");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtTime(s) {
  if (!s) return "";
  const d = new Date(s.replace(" ", "T") + "Z");
  if (isNaN(d)) return s;
  const jst = d.toLocaleString("ja-JP", {
    timeZone: "Asia/Tokyo", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  return s + " UTC（日本時間 " + jst + "）";
}

async function load(name, btn) {
  [...tabs.children].forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  list.innerHTML = "";
  msg.textContent = "読み込み中…";
  try {
    const url = "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(SOURCES[name]);
    const data = await (await fetch(url)).json();
    if (!data.items || !data.items.length) { msg.textContent = "記事が見つかりませんでした"; return; }
    msg.textContent = "";
    const items = data.items.slice().sort((a, b) => (b.pubDate || "").localeCompare(a.pubDate || ""));
    list.innerHTML = items.slice(0, 30).map(i =>
      `<li><a href="${esc(i.link)}" target="_blank" rel="noopener">${esc(i.title)}</a>` +
      `<small>${esc(fmtTime(i.pubDate))}</small></li>`).join("");
  } catch (e) {
    msg.textContent = "取得に失敗しました。少し待って再読み込みしてください";
  }
}
Object.keys(SOURCES).forEach((name, idx) => {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => load(name, b);
  tabs.appendChild(b);
  if (idx === 0) load(name, b);
});
</script>
</body>
</html>
